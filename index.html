<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiservApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #1c1c1e;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        min-height: 100vh;
        padding: 32px 0 48px;
        font-family: -apple-system, sans-serif;
      }

      .phone-shell {
        width: 430px;
        background: #000;
        border-radius: 56px;
        padding: 12px;
        box-shadow:
          0 0 0 1px #3a3a3a,
          0 50px 100px rgba(0,0,0,0.9),
          inset 0 1px 0 rgba(255,255,255,0.08);
        position: relative;
        flex-shrink: 0;
      }

      /* Dynamic island */
      .phone-island {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 37px;
        background: #000;
        border-radius: 20px;
        z-index: 100;
      }

      .phone-screen {
        width: 100%;
        border-radius: 46px;
        overflow: hidden;
        background: #EDEEE6;
        position: relative;
        /* altezza dinamica in base al contenuto, minimo schermo intero */
        min-height: 860px;
      }

      /* Status bar */
      .phone-status {
        position: sticky;
        top: 0;
        left: 0;
        right: 0;
        height: 59px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 32px 10px;
        z-index: 50;
        background: #EDEEE6;
        pointer-events: none;
      }
      .phone-status .time {
        font-size: 15px;
        font-weight: 650;
        color: #1A1A14;
        letter-spacing: -0.4px;
      }
      .phone-status .icons {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #1A1A14;
      }

      #root {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Side buttons */
      .btn-side { position: absolute; background: #2a2a2a; border-radius: 3px; }
      .btn-vol-up   { left: -4px; top: 148px; width: 4px; height: 34px; }
      .btn-vol-down { left: -4px; top: 196px; width: 4px; height: 34px; }
      .btn-power    { right: -4px; top: 178px; width: 4px; height: 66px; }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="btn-side btn-vol-up"></div>
      <div class="btn-side btn-vol-down"></div>
      <div class="btn-side btn-power"></div>
      <div class="phone-island"></div>

      <div class="phone-screen">
        <!-- Status bar fissa -->
        <div class="phone-status">
          <span class="time">9:41</span>
          <div class="icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
              <rect x="0" y="7" width="2.5" height="5" rx="0.8" opacity="0.3"/>
              <rect x="4" y="4.5" width="2.5" height="7.5" rx="0.8" opacity="0.5"/>
              <rect x="8" y="2" width="2.5" height="10" rx="0.8" opacity="0.8"/>
              <rect x="12" y="0" width="2.5" height="12" rx="0.8"/>
            </svg>
            <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor">
              <path d="M8 7.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
              <path d="M3 5.2C4.4 3.8 6.1 3 8 3s3.6.8 5 2.2l1.4-1.4C12.7 2.1 10.5 1 8 1S3.3 2.1 1.6 3.8L3 5.2z" opacity="0.6"/>
              <path d="M.2 2.4C2.1.9 4.9 0 8 0s5.9.9 7.8 2.4L14.4 3.8C12.8 2.7 10.5 2 8 2S3.2 2.7 1.6 3.8L.2 2.4z" opacity="0.35"/>
            </svg>
            <svg width="27" height="13" viewBox="0 0 27 13" fill="currentColor">
              <rect x="0.5" y="0.5" width="21" height="12" rx="3.5" stroke="currentColor" stroke-width="1" fill="none" opacity="0.35"/>
              <rect x="2" y="2" width="18" height="9" rx="2"/>
              <path d="M23 4.5v4a2 2 0 0 0 0-4z" opacity="0.45"/>
            </svg>
          </div>
        </div>

        <div id="root"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
