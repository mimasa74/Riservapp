<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #2c2c2a;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 40px;
  font-family: Georgia, 'Times New Roman', serif;
  gap: 20px;
}
.device { width: 340px; background: #1a1a1a; border-radius: 44px; padding: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
.screen { background: #EDEEE6; border-radius: 36px; overflow: hidden; height: 680px; display: flex; flex-direction: column; }
.status { background: #D6DBCA; padding: 10px 20px 4px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #1A1A14; flex-shrink: 0; }

/* HEADER — logo sx, testi centrati nel resto */
.header { background: #D6DBCA; padding: 6px 16px 14px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.logo-circle { width: 72px; height: 72px; border-radius: 50%; border: 2.5px solid #5C6B3A; background: #c8d4b8; flex-shrink: 0; overflow: hidden; }
.logo-circle img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
.header-text { flex: 1; display: flex; flex-direction: column; align-items: center; }
.header-pre { font-size: 10px; color: #5C6B3A; text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }
.header-title { font-size: 26px; font-weight: 700; color: #1A1A14; text-transform: uppercase; line-height: 1.1; }

/* DOTS */
.dots { display: flex; justify-content: center; gap: 7px; padding: 8px 0 4px; background: #EDEEE6; flex-shrink: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #c8d0b8; transition: all .3s; }
.dot.active { background: #5C6B3A; transform: scale(1.2); }

/* SUBZONE */
.subzone { display: flex; margin: 8px 14px 0; background: #D6DBCA; border-radius: 8px; padding: 3px; gap: 3px; flex-shrink: 0; }
.sz { flex: 1; padding: 7px 4px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-family: Georgia, serif; text-align: center; transition: all .2s; }
.sz.active { background: #5C6B3A; color: #EDEEE6; font-weight: 700; }
.sz.inactive { background: transparent; color: #5C6B3A; }

/* SCROLL */
.scroll { flex: 1; overflow-y: auto; padding: 10px 14px 20px; display: flex; flex-direction: column; gap: 10px; }
.scroll::-webkit-scrollbar { display: none; }

/* BLOCCO CATEGORIA */
.cat-block { background: #FFFFFF; border-radius: 10px; border: 1px solid #d0d5c4; padding: 14px 16px; }
.cat-nome { font-size: 16px; font-weight: 700; color: #1A1A14; text-transform: uppercase; letter-spacing: .02em; line-height: 1.2; }
.cat-desc { font-size: 13px; color: #6B6B5A; margin-top: 3px; }
.cat-bottom { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.cat-n { font-size: 14px; color: #1A1A14; white-space: nowrap; font-weight: 500; }
.boxes { display: flex; flex-wrap: wrap; gap: 5px; }
.box { width: 24px; height: 24px; border: 2px solid #5C6B3A; border-radius: 3px; background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background .1s; font-size: 12px; font-weight: 900; color: transparent; }
.box.hit { background: #8B1A1A; border-color: #8B1A1A; color: #fff; }
.box:active { transform: scale(.88); }

/* CHIUSO — badge sotto il nome */
.badge-chiuso { display: inline-block; margin-top: 6px; font-size: 14px; font-weight: 700; color: #8B1A1A; text-transform: uppercase; letter-spacing: .05em; }

/* NOTE */
.note-card { background: #FFFFFF; border-radius: 10px; border: 1px solid #d0d5c4; padding: 14px 16px; }
.note-text { font-size: 12px; color: #1A1A14; text-transform: uppercase; line-height: 1.65; }
.note-divider { border-top: 1px solid #d0d5c4; margin-top: 10px; padding-top: 10px; }
.alert-red { font-size: 13px; font-weight: 700; color: #8B1A1A; text-transform: uppercase; }
.alert-black { font-size: 13px; color: #1A1A14; text-transform: uppercase; }
.timestamp { text-align: center; font-size: 10px; color: #6B6B5A; font-style: italic; padding: 4px 0; }
.ruote-btn { background: #5C6B3A; border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: none; width: 100%; }
.ruote-btn span { font-size: 14px; font-weight: 700; color: #EDEEE6; text-transform: uppercase; letter-spacing: .05em; font-family: Georgia, serif; }

.switcher { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.sw-btn { background: #3a3a38; color: #a8a29e; border: none; border-radius: 20px; padding: 7px 16px; font-size: 12px; cursor: pointer; font-family: Georgia, serif; transition: all .15s; }
.sw-btn.active { background: #5C6B3A; color: #EDEEE6; }
.page-label { color: #a8a29e; font-size: 11px; font-family: Georgia, serif; }
</style>
</head>

let pag='cervo', zona='campa';

function renderBoxes(cat){
  let h='<div class="boxes">';
  for(let i=0;i<cat.n;i++) h+=`<div class="box${i<cat.hit?' hit':''}" onclick="toggle('${pag}','${cat.id}',${i})">×</div>`;
  return h+'</div>';
}

function render(){
  const s=dati[pag];
  document.getElementById('logo-img').src=LOGOS[pag];
  document.getElementById('header-title').textContent=s.titolo;
  for(let i=0;i<4;i++) document.getElementById('d'+i).className='dot'+(i===s.dot?' active':'');
  const szW=document.getElementById('subzone');
  szW.style.display=s.subzone?'flex':'none';
  if(s.subzone){
    document.getElementById('sz-campa').className='sz '+(zona==='campa'?'active':'inactive');
    document.getElementById('sz-tovel').className='sz '+(zona==='tovel'?'active':'inactive');
  }
  const cats=s.subzone?s.categorie.filter(c=>c.zona===zona):s.categorie;
  let html=cats.map(c=>{
    if(c.stato==='chiuso') return `<div class="cat-block">
      <div class="cat-nome">${c.nome}</div>
      ${c.desc?`<div class="cat-desc">${c.desc}</div>`:''}
      <div class="badge-chiuso">CHIUSO</div>
    </div>`;
    return `<div class="cat-block">
      <div class="cat-nome">${c.nome}</div>
      ${c.desc?`<div class="cat-desc">${c.desc}</div>`:''}
      <div class="cat-bottom"><span class="cat-n">n. ${c.n}</span>${renderBoxes(c)}</div>
    </div>`;
  }).join('');
  html+=`<div class="note-card"><div class="note-text">${s.note}</div>
    <div class="note-divider"><span class="alert-red">${s.alert} </span><span class="alert-black">${s.alertResto}</span></div>
  </div>`;
  html+=`<div class="timestamp">Ultimo aggiornamento: ${s.ts}</div>`;
  html+=`<button class="ruote-btn"><span>Ruote e Squadre</span><span style="color:#EDEEE6;font-size:18px">→</span></button>`;
  document.getElementById('scroll-area').innerHTML=html;
  document.getElementById('scroll-area').scrollTop=0;
}

function toggle(sp,id,i){
  const cat=dati[sp].categorie.find(c=>c.id===id);
  if(!cat) return;
  cat.hit=i===cat.hit-1?i:Math.min(i+1,cat.n);
  const now=new Date();
  dati[sp].ts=now.toLocaleDateString('it-IT')+' ore '+now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  render();
}
function showPage(sp,btn){
  pag=sp;zona='campa';
  document.querySelectorAll('.sw-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');render();
}
function switchZona(z){zona=z;render();}
render();
</script>
</body>
